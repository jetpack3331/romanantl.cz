# Production stack for Docker on a VPS (e.g. Hetzner). Copy .env on the server and run: docker compose up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
