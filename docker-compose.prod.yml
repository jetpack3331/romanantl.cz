services:
  web:
    image: ${IMAGE:?Set IMAGE env, e.g. ghcr.io/owner/repo:latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3004:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
