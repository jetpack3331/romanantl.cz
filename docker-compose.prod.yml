services:
  web:
    image: ${IMAGE:?Set IMAGE env, e.g. ghcr.io/owner/repo:latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3004:3000"
    # CRM data (sent log, unsubscribed contacts); host dir must be writable by uid 1000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
